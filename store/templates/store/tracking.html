{% extends 'base.html' %}
{% block title %}Track Order - GreenBusket{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12 border border-gray-100">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-truck-fast text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Track Your Order</h1>
            <p class="text-gray-500">Enter your Phone Number to check your order history.</p>
        </div>

        <form action="" method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="phone" class="block text-sm font-bold text-gray-700 mb-2">Phone Number</label>
                <input type="text" name="phone" id="phone" placeholder="e.g. 01700000000" required 
                       class="w-full px-5 py-4 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
            </div>

            <button type="submit" class="w-full bg-primary text-white font-bold py-4 rounded-xl hover:bg-emerald-700 transition-colors shadow-md hover:shadow-lg flex items-center justify-center gap-2 mt-4 text-lg">
                <i class="fa-solid fa-magnifying-glass"></i> Track Now
            </button>
        </form>
        
        <!-- Tracking Result Placeholder for later -->
        {% if error %}
        <div class="mt-6 p-4 bg-red-50 text-red-700 rounded-lg border border-red-100 flex items-start gap-3">
            <i class="fa-solid fa-circle-exclamation mt-1"></i>
            <p>{{ error }}</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
